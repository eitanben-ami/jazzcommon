[project]
name = "jazzcommon"
version = "0.1.0"
description = "Canonical jazz standards reference CLI and dataset"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Hermes Agent", email = "hermes@example.com"}]

[project.scripts]
jazzcommon = "jazzcommon:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["jazzcommon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
